<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><img src="icons/icon32.png" alt="" width="20" height="20"> Claude</div>
    <select id="model" aria-label="Model"></select>
    <button id="newChat" class="icon-btn" title="New chat" aria-label="New chat">＋</button>
    <button id="openSettings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main id="messages" aria-live="polite">
    <div id="empty" class="empty">
      <h1>How can I help?</h1>
      <div class="chips">
        <button class="chip" data-action="summarize">Summarize this page</button>
        <button class="chip" data-action="keypoints">Key points of this page</button>
        <button class="chip" data-action="explain">Explain this page simply</button>
      </div>
      <p id="noKey" class="notice" hidden>
        Add your Anthropic API key in <a href="#" id="settingsLink">Settings</a> to start.
      </p>
    </div>
  </main>

  <form id="composer" class="composer">
    <label class="page-toggle"><input type="checkbox" id="includePage"> Include current page</label>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Message Claude…" aria-label="Message"></textarea>
      <button id="send" type="submit" class="send" aria-label="Send">➤</button>
      <button id="stop" type="button" class="send stop" aria-label="Stop" hidden>■</button>
    </div>
  </form>

  <script type="module" src="chat.js"></script>
</body>
</html>
