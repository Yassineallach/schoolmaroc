; Aleatro's AdMob and "Remove ads" settings. Fill in your own IDs from
; AdMob (Apps > Aleatro > App settings, and Ad units) and Play Console
; (Monetize > Products > In-app products). See tools/ads/ADS.md.
;
; Every build uses these real IDs. Register your own phone under AdMob >
; Settings > Test devices so it gets test ads from them; any ID left empty
; falls back to Google's sample IDs, which only ever show test ads.

[admob]
; App ID, with a tilde: ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN
app_id="ca-app-pub-4106840885730797~9563703169"

[units]
; Ad unit IDs, with a slash: ca-app-pub-XXXXXXXXXXXXXXXX/NNNNNNNNNN
interstitial_cash_out="ca-app-pub-4106840885730797/2770616998"
interstitial_run_end="ca-app-pub-4106840885730797/7961353599"
rewarded_second_chance="ca-app-pub-4106840885730797/8041244644"
rewarded_shop_reroll="ca-app-pub-4106840885730797/2387473612"
rewarded_pack_pick="ca-app-pub-4106840885730797/2084221286"

[iap]
; Play Console in-app product ID of the one-time "Remove ads" purchase
remove_ads="remove_ads"

[debug]
; true switches every ad unit to Google's sample units (test ads only)
test_ads=false
