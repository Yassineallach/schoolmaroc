; Aleatro's AdMob and "Remove ads" settings. Fill in your own IDs from
; AdMob (Apps > Aleatro > App settings, and Ad units) and Play Console
; (Monetize > Products > In-app products). See tools/ads/ADS.md.
;
; Until the IDs below are filled in, and in every debug build, the game uses
; Google's sample IDs, which only ever show test ads.

[admob]
; App ID, with a tilde: ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN
app_id=""

[units]
; Ad unit IDs, with a slash: ca-app-pub-XXXXXXXXXXXXXXXX/NNNNNNNNNN
interstitial_cash_out=""
interstitial_run_end=""
rewarded_second_chance=""
rewarded_shop_reroll=""
rewarded_pack_pick=""

[iap]
; Play Console in-app product ID of the one-time "Remove ads" purchase
remove_ads="remove_ads"

[debug]
; true forces Google's test ads even in a release build (for your own testing)
test_ads=false
