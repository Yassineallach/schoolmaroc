    <script type="text/javascript">
        $(document).ready(function () {
            initializeBootstrapPopover('body');

            // Resize modal
            var columnCount = $(".availability__table tr:first th").length;
            var widthClass = "";
            if (columnCount >= 5) {
                widthClass = "modal-wide-90";
            } else {
                if (columnCount >= 3) {
                    widthClass = "modal-wide-80";
                }
            }

            window.parent.resizeModalBasicIframe(widthClass);

            const resizeObserver = new ResizeObserver(entries => {
                // Adjust heights to ensure scrolling within availability list works as expected.

                const bodyHeight = document.querySelector('body').offsetHeight;
                const titleHeight = document.querySelector('div.availability__title-container').offsetHeight;
                const messageElement = document.querySelector('div.AvailabilityHoldsMessage');
                const messageStyle = window.getComputedStyle(messageElement);
                const messageHeight = messageElement.offsetHeight + parseFloat(messageStyle.marginTop) + parseFloat(messageStyle.marginBottom);
                document.querySelector('div.availability--full-page').style.height = '100%';
                document.querySelector('div.availability__table-container').style.height = (bodyHeight - titleHeight - messageHeight).toString() + 'px';
            });

            resizeObserver.observe(document.body);
        });
    </script>
