# Builds the signed Play bundle (.aab) and APK in the cloud.
# Run it from the repository's Actions tab: "Build release" > Run workflow.
# Secrets (Settings > Secrets and variables > Actions), see BUILD-GITHUB.md:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# The AdMob IDs are in app/build.gradle.kts (optional secrets ADMOB_APP_ID / ADMOB_NATIVE_UNIT_ID override them).
name: Build release

on:
  workflow_dispatch:
    inputs:
      test_ads:
        description: "Show Google's TEST ads in this release (leave off for the Play upload)"
        type: boolean
        default: false
      run_tests:
        description: "Run the unit tests first"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE_UNIT_ID: ${{ secrets.ADMOB_NATIVE_UNIT_ID }}
          TEST_ADS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_ads || false }}
        run: bash tools/ci/write-local-properties.sh local.properties

      - name: Unit tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        run: chmod +x gradlew && ./gradlew test --console=plain

      - name: Build bundle and APK
        run: chmod +x gradlew && ./gradlew :app:bundleRelease :app:assembleRelease --console=plain

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: nearshelf-release-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
          if-no-files-found: ignore

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" local.properties
